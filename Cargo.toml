[package]
name = "veyron-wm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An independent Wayland compositor written in Rust"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "wayland_frontend"] }
wayland-protocols = { version = "0.32.13", features = ["server"] }
wayland-server = "0.31.13"
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "rwh_06"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
